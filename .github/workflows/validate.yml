name: Validate RentalManager
on: [push, pull_request]
jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 Tools/source_check.py
      - run: dotnet restore RentalManager.sln
      - run: dotnet build RentalManager.sln --no-restore --configuration Release
      - run: dotnet test Tests/RentalManager.Tests.csproj --no-build --configuration Release --filter 'FullyQualifiedName!~HousesAndShopsUseTheSamePaymentsAndContracts'
  sql-workflow:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'RentalTest_2026!Only'
        ports:
          - 1433:1433
    env:
      RENTAL_TEST_CONNECTION: 'Server=localhost,1433;User ID=sa;Password=RentalTest_2026!Only;TrustServerCertificate=true;'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Wait for test SQL Server
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          for attempt in $(seq 1 30); do
            if docker exec "$SQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RentalTest_2026!Only' -C -Q 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo 'SQL Server did not become ready'; exit 1
      - run: dotnet test Tests/RentalManager.Tests.csproj --configuration Release --filter 'FullyQualifiedName~HousesAndShopsUseTheSamePaymentsAndContracts'
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/rental-browser" --no-save --package-lock=false playwright
          "$RUNNER_TEMP/rental-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check browser workflows and responsive layout
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          Database__ConnectionName: BrowserTest
        run: |
          export ConnectionStrings__BrowserTest="${RENTAL_TEST_CONNECTION}Database=Chwaya_BrowserTest;"
          export NODE_PATH="$RUNNER_TEMP/rental-browser/node_modules"
          dotnet run --project RentalManager.csproj --configuration Release --no-build --no-launch-profile > /tmp/rental-browser-server.log 2>&1 &
          rental_server_pid=$!
          trap 'kill "$rental_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/Account/Login >/dev/null; then break; fi
            sleep 2
          done
          node Tools/browser_check.cjs || { cat /tmp/rental-browser-server.log; exit 1; }
      - name: Upload UI check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-ui-check
          path: /tmp/rental-comments-*.png
          if-no-files-found: ignore
